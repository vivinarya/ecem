name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ecem_core

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Native Rust Unit Tests
        run: cargo test --all-targets --all-features

  python-checks:
    name: Python Lint & Matrix Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python Dependencies & Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-benchmark maturin

      - name: Check Python Code Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Python (Ruff)
        run: ruff check .

      - name: Build and Install Crate in Dev Virtualenv
        run: maturin develop

      - name: Type Checking (Mypy)
        run: mypy python/

      - name: Run Pytest Test Suite
        run: pytest -v tests/
